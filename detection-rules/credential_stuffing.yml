title: Potential Credential Stuffing Activity
id: a1e2c3d4-0001-4a1b-9c3d-000000000001
status: experimental
description: >
  Detects a single source IP generating a high volume of authentication
  failures across many distinct usernames within a short window, indicative
  of a credential-stuffing attack.
author: Valliammai G
date: 2026/08/26
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  timeframe: 5m
  condition: selection | count(TargetUserName) by IpAddress > 5 and count() by IpAddress > 15
falsepositives:
  - Shared NAT/VPN egress IPs with many legitimate users
  - Password-expiry events causing mass re-authentication
level: high
tags:
  - attack.credential_access
  - attack.t1110.004
